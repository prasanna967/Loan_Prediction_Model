# Render Blueprint - https://render.com/docs/blueprint-spec
# After the first deploy, set ALLOWED_ORIGINS to the frontend URL and
# VITE_API_BASE_URL to the API URL in the Render dashboard, then redeploy.
services:
  - type: web
    name: loan-eligibility-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: loan-eligibility-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
